# make sure this matches the data generation
simulation:
  seed: 42
  grid_lims: [0, 10]
  sample_sizes: [100] #, 300]  # Different sample sizes for datasets
  dimensions: [3] #, 3]  # 1D, 2D, or 3D datasets
  likelihoods: 
    - gaussian
   # - t
   # - chi
    - ald
    - ald_heteroscedastic
  pars : {
    "gaussian": {"scale": 0.5},
    "ald": {"q": 0.8, "scale": 0.1},
    "t": {"df": 3, "scale": 1},
    "chi": {"df": 2, "scale": 1}
  }
  ## useless can be removed ? --> noise_levels: [0.1, 0.2, 0.3]  # Noise levels for adding to data
  replicates: 5 # 10

# for simulation !
gp_parameters:
  kernel:
    type: matern
    nu: 1.5
    lengthscale: 0.5
    signal_variance: 2.0
  # You can add more GP parameters as needed

output:
  data_directory: './data/'  # Directory to save generated datasets
  log_directory: './logs/'   # Directory to save logs

# specific for the simulation run
approximation: "asymmetric_laplace_constant_curvature_fisher_mode_finding"
threshold_approximation: 1001
inducing_points:  500

## TARGET QUANTILE ##
target_quantile: 0.8

delta_logl: 10

# level for prediction intervals --> build a alphax100% prediction interval
alpha: 0.9

train_split: 0.75

models: ["gpboost_cc", "gpboost_cc_var_corr", "gpytorch", "qgam"]
# hyper-params --> useful for producing later results
models_with_hyperparams: ["gpboost_cc", "gpboost_cc_var_corr", "gpytorch"]

gpb_approxs: {"gpboost_lls": "asymmetric_laplace_constant_curvature_fisher_mode_finding",
            "gpboost_cc": "asymmetric_laplace_constant_curvature_fisher_mode_finding",
            "gpboost_cc_var_corr": "asymmetric_laplace_constant_curvature_fisher_mode_finding_var_cor_pred"}


# for GPytorch
n_epochs : 200
lr: 0.01


# fix dicts
name_dict : {"gpboost_lls": "LLS", "gpboost_cc": "CC", "gpytorch": "VI", "qgam":"GAM",
            "gpboost_cc_var_corr": "CC corr"}
likelihood_dict : {"gaussian":"N", "ald": "ALD", "t":"t", "chi":"chi", "ald_heteroscedastic": HetALD}

# what I want to plot
all_models: ["gpboost_cc", "gpboost_cc_var_corr", "gpytorch"] # ["gpboost_lls", "gpboost_cc", "gpytorch", "qgam"]



