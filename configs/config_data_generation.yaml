simulation:
  seed: 43
  grid_lims: [0, 10]
  sample_sizes: [1000]  # Different sample sizes for datasets
  dimensions: [1, 2, 3]  # 1D, 2D, or 3D datasets
  likelihoods: 
    - gaussian
   # - t
   # - chi
    #- ald
    #- ald_heteroscedastic # testing heteroscedasticity
  
  # Simulation Settings
  snr: 10.0                # Desired signal-to-noise ratio
  fixed_snr: True          # True = homoscedastic noise with this SNR; False = heteroscedastic
  pars : {
    "gaussian": {"scale": 0.31}, # sqrt(0.31) -> 0.1
    "ald": {"q": 0.8, "scale": 0.1}, #
    "t": {"df": 3, "scale": 0.1},
    "chi": {"df": 2, "scale": 0.1}
  }
  # useless noise_levels: [0.1, 0.2, 0.3]  # Noise levels for adding to data
  replicates: 5

gp_parameters:
  kernel:
    type: matern
    nu: 1.5
    lengthscale: 0.5
    signal_variance: 1.0
  # You can add more GP parameters as needed

output:
  data_directory: './data/'  # Directory to save generated datasets
  log_directory: './logs/'   # Directory to save logs

