gp_parameters:
  kernel:
    type: matern
    nu: 1.5
    lengthscale: 0.5
    signal_variance: 2.0
 

# specific for the simulation run
## TARGET QUANTILE
target_quantile: 0.8

threshold_approximation: 1001
inducing_points:  1000

delta_logl: 10

# level for prediction intervals --> build a alphax100% prediction interval
alpha: 0.9

n_splits: 2


datasets: ["bike"] # , "power"] #, "power", "houses", "elevators", "protein"]
models: ["gpboost_cc", "gpytorch"] #, "gpboost_lls", "gpytorch"], gpboost_cc
gpb_approxs: {"gpboost_lls": "asymmetric_laplace_constant_curvature_fisher_mode_finding",
            "gpboost_cc": "asymmetric_laplace_constant_curvature_fisher_mode_finding"}


# for GPytorch
n_epochs : 1

lr: 0.01

# for later, plotting
all_models:  ["gpboost_cc", "gpytorch", "qgam"] # "gpboost_lls", 
name_dict : {"gpboost_lls": "LLS", "gpboost_cc": "CC", "gpytorch": "VI", "qgam":"GAM"}
