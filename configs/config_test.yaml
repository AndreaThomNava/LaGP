# General parameters for data generation and splitting

data_generation:
  n_groups: [10, 100, 500, 1000] # [200,  1000]
  group_size: [10, 100, 1000] #, 100, 500, 1000]
  
  n_groups_2 : 50 # how many levels for the second random effect -->  group_size > n_groups_2
                    # N/n_group_2, should be an integer
  signal_variance: 1.0 # for one grouped random effect
  signal_variance_2: 2.0 # for second random effect
  
  fixed_srn: True
  snr: 5.0
  quantile: 0.8
  likelihood: ["ald", "gaussian"]
  pars : {
    "gaussian": {"scale": 0.31}, # sqrt(0.31) -> 0.1
    "ald": {"q": 0.8, "scale": 0.1}, #
    "t": {"df": 3, "scale": 0.1},
    "chi": {"df": 2, "scale": 0.1}
  }
  replicate: 5
  test_size: 0.8
  randeff: "Two_completely_crossed_random_effects" # "One_random_effect"
  output_folder: "simulated_data_mm"
  random_state: 123
  extrapolate: False

  # FIXED EFFECTS
  num_covariates: 5
  has_F: False
  factor_m2: 1.0
  

  # FOR MORE COMPLEX RANDOM EFFECTS STRUCTURES
  sigma2: 0.25 
  sigma2_1: 0.25
  sigma2_2: 0.25
  sigma2_3: 0.25




##### for running simulation ########
  
models: ["gpboost_cc", "gpboost_lls"] #, "gpboost_cc_var_corr"]
replicate: 2
n_groups: [10, 100, 500, 1000] # [200,  1000]
group_size: [10, 100, 1000] #, 100, 500, 1000]
likelihood: ["ald", "gaussian"]
randeff: "Two_completely_crossed_random_effects"

  
delta_logl: 10
alpha: 0.9
target_quantile: 0.8
gpb_approxs: {"gpboost_lls": "asymmetric_laplace_constant_curvature_fisher_mode_finding",
            "gpboost_cc": "asymmetric_laplace_constant_curvature_fisher_mode_finding",
            "gpboost_cc_var_corr": "asymmetric_laplace_constant_curvature_fisher_mode_finding_var_cor_pred"}



##### for the analysis of the results ######
all_models : ["gpboost_cc", "gpboost_lls"] #, "gpboost_cc_var_corr", "lqmm", "brms"]
models_with_hyperparams : ["gpboost_cc", "gpboost_lls"] #,"gpboost_cc_var_corr","lqmm", "brms"]


name_dict : {"gpboost_lls": "LLS", "gpboost_cc": "CC", "gpboost_cc_var_corr": "CC corr",
           "brms": "BRMS", "lqmm":"LQMM"}
           
likelihood_dict : {"gaussian":"N", "ald": "ALD", "t":"t", "chi":"chi", "ald_heteroscedastic": HetALD}


